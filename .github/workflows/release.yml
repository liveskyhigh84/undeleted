name: Build release binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: taskguardian-macos
          - os: ubuntu-latest
            asset: taskguardian-linux
          - os: windows-latest
            asset: taskguardian-windows.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name taskguardian-bin --paths . taskguardian.py

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/taskguardian-bin.exe "release/${{ matrix.asset }}"
          else
            cp dist/taskguardian-bin "release/${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
