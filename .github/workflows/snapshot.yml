name: UnDeleted snapshot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run snapshot
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python undeleted.py snapshot

      - name: Commit and push snapshot
        run: |
          git config user.name "UnDeleted Bot"
          git config user.email "undeleted@localhost"
          git add snapshots/
          git diff --staged --quiet || git commit -m "snapshot: automated run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
